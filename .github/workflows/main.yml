name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages needs these to switch the site over to Actions-based
      # publishing. Without that step GitHub keeps its legacy branch builder,
      # which serves the repository root verbatim — the unbuilt source, with no
      # stylesheet and a <script src="/src/main.ts"> the browser cannot run.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # actions/configure-pages only *creates* a Pages site when none exists; it
      # will not convert an already-enabled site from GitHub's legacy branch
      # builder to Actions publishing. While the site is on the branch builder,
      # it publishes the repository root verbatim — the unbuilt source, with no
      # stylesheet and a <script src="/src/main.ts"> the browser cannot run — and
      # that build silently wins over the artifact this workflow uploads.
      - name: Ensure Pages publishes from Actions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "Pages is set to publish from GitHub Actions."
          else
            echo "::warning title=Pages still on the legacy branch builder::Could not switch publishing automatically. Set Settings -> Pages -> Source to 'GitHub Actions', otherwise the deployed site keeps serving the unbuilt repository root."
          fi

      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        # Take the base path from Pages when it is known, so the build keeps
        # working if the repository is ever renamed.
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
